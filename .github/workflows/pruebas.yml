# Corre las pruebas unitarias y el revisor de estilo en cada push y pull request.
# No necesita GPU ni modelos: el LLM y los embeddings se simulan (tests/unit/conftest.py).
name: Pruebas

on:
  push:
  pull_request:

jobs:
  unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: pytest
