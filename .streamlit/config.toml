# Aspecto de la consola de administración: los mismos colores planos que la página del avatar.
[theme]
base = "light"
primaryColor = "#1d3f72"
backgroundColor = "#f3efe6"
secondaryBackgroundColor = "#e7e1d3"
textColor = "#1c1b19"
font = "sans serif"
baseRadius = "2px"
buttonRadius = "2px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
