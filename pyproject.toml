# Configuración de herramientas. Las dependencias siguen en requirements*.txt, que es lo que
# usa instalar.ps1.

[project]
name = "asistente-tec"
version = "0.2.0"
description = "Asistente virtual con avatar para estudiantes: RAG, voz, consola y Teams"
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
# `pytest` solo corre las pruebas unitarias (sin modelos ni GPU). Las de integración son
# scripts: python -m tests.integracion.<nombre>
testpaths = ["tests/unit"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # textos largos (instrucciones, selectores de Teams) se leen mejor en una línea
    "B905",   # zip() de listas que Chroma devuelve con el mismo largo
    "E731",   # lambdas cortas con nombre (wake.py)
    "B008",   # Depends()/Form() en los parámetros es el estilo de FastAPI
    "SIM105", # try/except/pass se lee mejor que contextlib.suppress en estos casos
    "UP017",  # datetime.UTC no existe en 3.10
    "SIM905", # listas de palabras escritas como texto se leen y editan mejor (intent.py, keyword.py)
]

[tool.ruff.lint.per-file-ignores]
"app/consola.py" = ["E402"]
