<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente Tec</title>
  <link rel="stylesheet" href="style.css">
  <!-- Todo se sirve desde vendor/: la página funciona sin internet (three.js se descarga con
       scripts/vendorizar_three.py). -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "talkinghead": "./vendor/talkinghead/talkinghead.mjs",
      "headaudio": "./vendor/headaudio/headaudio.min.mjs"
    }
  }
  </script>
</head>
<body data-status="loading">

  <main id="stage">
    <div id="avatar" aria-hidden="true"></div>

    <header class="topbar">
      <div class="identity">
        <h1 id="assistant-name">Asistente Tec</h1>
        <p id="assistant-description"></p>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status-label">Cargando…</span>
      </div>
      <button id="settings-open" class="text-button" type="button" data-i18n="settings">Configuración</button>
    </header>

    <section class="dialog">
      <p id="user-line" class="user-line" hidden></p>
      <p id="subtitle" class="subtitle" aria-live="polite" hidden></p>
      <p id="meta" class="meta" hidden></p>
      <div id="feedback" class="feedback" hidden>
        <span id="feedback-label" data-i18n="useful">¿Te sirvió la respuesta?</span>
        <button type="button" data-rating="good" aria-pressed="false" data-i18n-label="useful">👍</button>
        <button type="button" data-rating="bad" aria-pressed="false" data-i18n-label="notUseful">👎</button>
      </div>

      <form id="ask-form" class="ask" autocomplete="off">
        <button id="mic" class="mic" type="button" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3.500 3.500 0 0 0 3.500-3.500v-6a3.500 3.500 0 0 0-7 0v6A3.500 3.500 0 0 0 12 15zm6-3.500a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.900V20H8.500a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2H13v-2.600a6 6 0 0 0 5-5.900z"/></svg>
          <span data-i18n="mic">Hablar</span>
        </button>
        <input id="question" type="text" placeholder="Escribe tu pregunta" data-i18n-placeholder="placeholder" disabled>
        <button id="send" class="send" type="submit" data-i18n="send" disabled>Enviar</button>
      </form>
      <p class="hint" data-i18n="hint">Pulsa Hablar y di tu pregunta; se envía sola cuando terminas.</p>
    </section>
  </main>

  <aside id="settings" class="settings" aria-label="Configuración" hidden>
    <div class="settings-head">
      <h2 data-i18n="settings">Configuración</h2>
      <button id="settings-close" class="text-button" type="button" data-i18n="close">Cerrar</button>
    </div>
    <label><span data-i18n="profile">Asistente</span><select id="profile"></select></label>
    <label><span data-i18n="language">Idioma</span><select id="language"></select></label>
    <label class="check"><input id="auto-language" type="checkbox"><span data-i18n="autoLanguage">Detectar el idioma al hablar</span></label>
    <label><span data-i18n="character">Personaje</span><select id="character"></select></label>
    <label><span data-i18n="engine">Motor de voz</span>
      <select id="engine">
        <option value="piper" data-i18n="enginePiper">Piper (rápida)</option>
        <option value="chatterbox" data-i18n="engineChatterbox">Chatterbox (natural, más lenta)</option>
      </select>
    </label>
    <label><span data-i18n="voice">Voz</span><select id="voice"></select></label>
    <label><span data-i18n="micDevice">Micrófono</span><select id="mic-device"></select></label>
    <label><span data-i18n="outputDevice">Salida de audio</span><select id="output-device"></select></label>
    <label class="check"><input id="hands-free" type="checkbox"><span data-i18n="handsFree">Conversación continua: vuelve a escuchar al terminar de hablar</span></label>
    <label class="check"><input id="meeting" type="checkbox"><span data-i18n="meetingMode">Modo reunión: vista limpia, escucha siempre y solo contesta cuando dicen su nombre</span></label>
    <label><span data-i18n="bargeIn">En reunión, deja de hablar</span>
      <select id="barge-in">
        <option value="name" data-i18n="bargeInName">Solo si dicen su nombre</option>
        <option value="voice" data-i18n="bargeInVoice">Con cualquier voz</option>
      </select>
    </label>
    <p id="heard" class="heard" hidden></p>
    <button id="new-chat" class="secondary" type="button" data-i18n="newChat">Nueva conversación</button>
    <p id="license" class="license"></p>
  </aside>

  <div id="start" class="start">
    <div class="start-card">
      <h2>Asistente Tec</h2>
      <p data-i18n="startText">Pregúntame por trámites, fechas y servicios del Tec. Puedes hablar o escribir.</p>
      <button id="start-button" type="button" data-i18n="start" disabled>Comenzar</button>
      <p id="start-progress" class="start-progress">Cargando…</p>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
